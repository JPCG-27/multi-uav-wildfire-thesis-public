; Live Coding is disabled for this project on purpose.
;
; The Thesis module registers global shader types (FDroneLocalPriorityComputeCS,
; pixel-bleed spreader, priority compute, ...). Live Coding patch DLLs re-run
; the shader-type static initializers, which trips the engine assert
; "Shader type was loaded too late" and crashes the editor. UE does not support
; hot-patching modules that register shader types.
;
; Workflow instead: close the editor (or just don't use Ctrl+Alt+F11), build the
; Thesis module from Visual Studio / Rider / UBT, then reopen the editor.
[/Script/LiveCoding.LiveCodingSettings]
bEnabled=False
